name: Playground
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  playground:
    name: Playground host contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public links, images and embeds
        run: python3 scripts/check-links.py
      - run: npm install --no-save --package-lock=false playwright@1.61.0
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a node scripts/test-playground.cjs
